<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>webblox browser</title>
  <style>
    :root { color-scheme: dark; font: 15px system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0f1115; color: #e8e8ea; }
    body { display: flex; flex-direction: column; }
    nav { display: flex; gap: 6px; padding: 8px; padding-top: max(8px, env(safe-area-inset-top)); background: #181b21; border-bottom: 1px solid #2a2e36; align-items: center; }
    nav button, nav a { flex: none; min-width: 40px; height: 40px; border: 1px solid #2a2e36; border-radius: 8px; background: #22262e; color: inherit; font: inherit; text-decoration: none; display: grid; place-items: center; padding: 0 10px; cursor: pointer; }
    nav a.play { background: #2f6feb; border-color: #2f6feb; font-weight: 600; }
    form { flex: 1; min-width: 0; display: flex; }
    input { flex: 1; min-width: 0; height: 40px; border: 1px solid #2a2e36; border-radius: 8px; background: #0f1115; color: inherit; font: inherit; padding: 0 10px; }
    #status { padding: 6px 10px; font-size: 13px; color: #9aa0aa; }
    #status:empty { display: none; }
    #status.error { color: #ff7b72; }
    iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  </style>
</head>
<body>
  <nav>
    <button id="back" type="button" aria-label="Back">‹</button>
    <button id="reload" type="button" aria-label="Reload">↻</button>
    <form id="go"><input id="url" type="url" inputmode="url" autocomplete="off" spellcheck="false" aria-label="Address"></form>
    <a class="play" href="/blox/" target="_blank" rel="opener">Play</a>
  </nav>
  <div id="status" role="status">Starting…</div>
  <iframe id="frame" title="Roblox" allow="clipboard-write"></iframe>
  <script src="/browse/scramjet/scramjet.js"></script>
  <script src="/browse/controller/controller.api.js"></script>
  <script type="module" src="/browse/app.js"></script>
</body>
</html>
