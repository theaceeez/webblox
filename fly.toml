# fly launch --copy-config --no-deploy, then: fly volumes create webblox_vendor --size 1, fly deploy
app = "webblox-CHANGE-ME"
primary_region = "iad"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8080"

[mounts]
  source = "webblox_vendor"
  destination = "/app/vendor"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
